# ── FaceLandmarker project config ────────────────────────────────────────────

mediapipe:
  max_num_faces: 1
  refine_landmarks: true          # enables iris + detailed lip landmarks
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

mouth:
  # Output patch size (w x h) for the normalized mouth crop
  output_width: 128
  output_height: 64

  # Padding ratio around the bounding box (0.2 = 20% each side)
  bbox_pad: 0.25

  # Affine normalization: canonical (target) mouth corner positions
  # expressed as fractions of [output_width, output_height]
  canonical_left:  [0.20, 0.50]   # left corner  → (25.6, 32)
  canonical_right: [0.80, 0.50]   # right corner → (102.4, 32)
  canonical_top:   [0.50, 0.20]   # top center   → (64,   12.8)

io:
  input_video: ""           # fill in at runtime or pass via CLI
  output_dir: "output"
  save_debug_frames: true   # overlay landmarks on saved frames
  video_ext: ".mp4"
